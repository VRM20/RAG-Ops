name: RAG Eval Gate

# The RAG-Ops quality gate. Any PR that changes how the RAG system behaves (prompts,
# chunking, embedding model, retrieval/generation code, model routing, corpus or golden
# dataset) is evaluated end to end with DeepEval against real models:
#
#   Qdrant service container -> ingest corpus -> answer golden set -> LLM-judge scores
#   -> gates (faithfulness / contextual recall >= 0.85, no regression, zero ACL leaks)
#
# The job fails (and, with branch protection, blocks the merge) when a gate fails.
# The Markdown report is posted as a sticky PR comment and to the job summary.

# No workflow-level `paths:` filter on purpose: a required status check whose workflow
# is filtered out never reports, leaving PRs stuck on "Expected - waiting". The
# `changes` job decides instead; a skipped gate job counts as success.
on:
  pull_request:
    branches: [main, uat]
  workflow_dispatch:
    inputs:
      max_cases:
        description: "Limit the number of golden cases (empty = all)"
        required: false

concurrency:
  group: rag-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect RAG-affecting changes
    runs-on: ubuntu-latest
    outputs:
      rag: ${{ steps.filter.outputs.rag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "rag=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          echo "$changed"
          if echo "$changed" | grep -qE '^(config/|src/ragops/|data/corpus/|evals/datasets/|evals/baselines/|evals/test_rag_quality\.py|pyproject\.toml|\.github/workflows/rag-eval-gate\.yml)'; then
            echo "rag=true" >> "$GITHUB_OUTPUT"
          else
            echo "rag=false" >> "$GITHUB_OUTPUT"
          fi

  eval-gate:
    name: RAG Eval Gate
    needs: changes
    # Run only when RAG behaviour may have changed. Secrets are not exposed to PRs from
    # forks, so those are skipped instead of failing obscurely.
    if: >-
      needs.changes.outputs.rag == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]

    env:
      RAGOPS_ENV: ci
      RAGOPS_OFFLINE: "false"
      QDRANT_URL: http://localhost:6333
      TASK_QUEUE: inline
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_APPLICATION_CREDENTIALS: secrets/gcp-vertex-key.json
      VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION || 'global' }}
      VERTEX_EMBEDDING_LOCATION: ${{ vars.VERTEX_EMBEDDING_LOCATION || 'us-central1' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      EVAL_MAX_CASES: ${{ inputs.max_cases || vars.EVAL_MAX_CASES || '' }}
      EVAL_LABEL: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'manual' }}
      RAGOPS_REPORT_DIR: evals/reports
      # Optional: send CI traces to Phoenix Cloud / Langfuse
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || '' }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[eval,dev]"

      - name: Write GCP service-account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p secrets
          printf '%s' "$GCP_SA_KEY" > secrets/gcp-vertex-key.json
          python -c "import json; assert json.load(open('secrets/gcp-vertex-key.json'))['type'] == 'service_account'"

      # Gemini PDF parsing is cached by content hash: unchanged PDFs are never re-parsed.
      - name: Restore parse cache
        uses: actions/cache@v4
        with:
          path: data/state/parse_cache
          key: parse-${{ hashFiles('data/corpus/**', 'config/prompts/pdf_parse_v1.yaml') }}
          restore-keys: parse-

      - name: Verify credentials
        run: ragops doctor

      - name: Ingest corpus
        run: ragops ingest

      - name: Run DeepEval quality gate
        id: gate
        run: pytest evals/test_rag_quality.py -m eval -v -p no:cacheprovider --junitxml=evals/reports/junit.xml

      - name: Job summary
        if: always()
        run: |
          if [ -f evals/reports/report.md ]; then cat evals/reports/report.md >> "$GITHUB_STEP_SUMMARY"; \
          else echo "Evaluation did not produce a report - see logs." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: evals/reports/
          if-no-files-found: ignore

      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'evals/reports/report.md';
            const marker = '<!-- ragops-eval-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8') + `\n[Full logs and artifacts](${runUrl})`
              : `${marker}\n## RAG Eval Gate: ⚠️ no report\nThe evaluation did not complete. [See logs](${runUrl}).`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
