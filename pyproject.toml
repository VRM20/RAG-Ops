[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragops"
version = "0.1.0"
description = "Enterprise RAG-Ops: hybrid-search RAG on Vertex AI + AWS Bedrock with CI/CD evaluation gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  # LLM / provider layer
  "litellm>=1.77",
  "google-auth>=2.40",
  "google-cloud-aiplatform>=1.100",
  "boto3>=1.40",
  # Retrieval
  "qdrant-client>=1.15",
  "numpy>=2.0",
  "snowballstemmer>=2.2",
  # Ingestion
  "pypdf>=5.0",
  "fpdf2>=2.8",
  "python-multipart>=0.0.20",
  # API + workers
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "celery[redis]>=5.4",
  "tenacity>=8.5",
  # Observability
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "openinference-instrumentation-litellm>=0.1.20",
  "openinference-semantic-conventions>=0.1.20",
]

[project.scripts]
ragops = "ragops.cli:main"

[project.optional-dependencies]
eval = [
  "deepeval>=4.3",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "eval: LLM-judged evaluation suite (needs cloud credentials, costs money)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# One-shot CLI process: blocking file I/O inside asyncio.run() is fine there.
"src/ragops/cli.py" = ["ASYNC240"]
